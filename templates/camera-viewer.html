<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-CAM Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            opacity: 0.9;
            font-weight: 300;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            padding: 30px;
            gap: 30px;
        }
        
        .camera-section {
            flex: 3;
            min-width: 300px;
        }
        
        .controls-section {
            flex: 1;
            min-width: 250px;
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .video-container {
            position: relative;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 4/3;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        #streamImage {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        
        .status-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
            box-shadow: 0 0 10px rgba(255,71,87,0.5);
        }
        
        .status-indicator.connected {
            background: #2ed573;
            box-shadow: 0 0 10px rgba(46,213,115,0.5);
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2em;
        }
        
        .control-group {
            margin-bottom: 25px;
        }
        
        h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 500;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .btn-secondary {
            background: #3498db;
            color: white;
        }
        
        .btn-success {
            background: #2ecc71;
            color: white;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .stats {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .stat-label {
            color: #7f8c8d;
        }
        
        .stat-value {
            font-weight: 600;
            color: #2c3e50;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .controls-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📷 ESP32-CAM Viewer</h1>
            <p class="subtitle">Real-time Camera Streaming Dashboard</p>
        </header>
        
        <div class="main-content">
            <div class="camera-section">
                <div class="video-container">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <img id="streamImage" src="" alt="Camera Stream">
                    <div class="loading" id="loadingText">Connecting to camera...</div>
                </div>
                
                <div class="buttons">
                    <button class="btn-primary" onclick="startStream()">▶ Start Stream</button>
                    <button class="btn-secondary" onclick="takeSnapshot()">📸 Snapshot</button>
                    <button class="btn-danger" onclick="stopStream()">⏹ Stop Stream</button>
                </div>
            </div>
            
            <div class="controls-section">
                <div class="control-group">
                    <h3>📡 Camera Settings</h3>
                    
                    <div class="input-group">
                        <label for="cameraIP">Camera IP Address:</label>
                        <input type="text" id="cameraIP" value="192.168.1.100" placeholder="Enter camera IP">
                    </div>
                    
                    <div class="buttons">
                        <button class="btn-success" onclick="connectCamera()">Connect</button>
                        <button class="btn-secondary" onclick="detectCamera()">Auto Detect</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <h3>⚙️ Stream Controls</h3>
                    <div class="buttons">
                        <button class="btn-secondary" onclick="toggleFullscreen()">🖥 Fullscreen</button>
                        <button class="btn-secondary" onclick="refreshStream()">🔄 Refresh</button>
                    </div>
                </div>
                
                <div class="stats" id="statsPanel">
                    <h3>📊 Statistics</h3>
                    <div class="stat-item">
                        <span class="stat-label">Status:</span>
                        <span class="stat-value" id="statStatus">Disconnected</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">FPS:</span>
                        <span class="stat-value" id="statFPS">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Last Update:</span>
                        <span class="stat-value" id="statLastUpdate">Never</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Frame Count:</span>
                        <span class="stat-value" id="statFrames">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cameraIP = "192.168.1.100";
        let streamInterval = null;
        let isStreaming = false;
        let frameCount = 0;
        let lastFrameTime = 0;
        let fps = 0;

        // DOM Elements
        const streamImage = document.getElementById('streamImage');
        const statusIndicator = document.getElementById('statusIndicator');
        const loadingText = document.getElementById('loadingText');
        const cameraIPInput = document.getElementById('cameraIP');
        const statStatus = document.getElementById('statStatus');
        const statFPS = document.getElementById('statFPS');
        const statLastUpdate = document.getElementById('statLastUpdate');
        const statFrames = document.getElementById('statFrames');

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            cameraIPInput.value = localStorage.getItem('lastCameraIP') || "192.168.1.100";
            updateCameraIP();
            checkCameraStatus();
        });

        function updateCameraIP() {
            cameraIP = cameraIPInput.value.trim();
            localStorage.setItem('lastCameraIP', cameraIP);
        }

        async function checkCameraStatus() {
            try {
                const response = await fetch(`http://${cameraIP}/status`, { 
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    updateStatus(true, `Connected (${data.ip})`);
                    return true;
                }
            } catch (error) {
                updateStatus(false, "Cannot reach camera");
            }
            return false;
        }

        function updateStatus(connected, message) {
            if (connected) {
                statusIndicator.classList.add('connected');
                loadingText.style.display = 'none';
                statStatus.textContent = 'Connected';
                statStatus.style.color = '#2ed573';
            } else {
                statusIndicator.classList.remove('connected');
                loadingText.style.display = 'block';
                statStatus.textContent = 'Disconnected';
                statStatus.style.color = '#ff4757';
            }
        }

        function startStream() {
            if (isStreaming) return;
            
            updateCameraIP();
            isStreaming = true;
            streamImage.style.display = 'block';
            loadingText.style.display = 'none';
            
            // MJPEG stream URL
            const streamUrl = `http://${cameraIP}/stream`;
            streamImage.src = streamUrl + '?' + new Date().getTime();
            
            // Start monitoring FPS
            frameCount = 0;
            lastFrameTime = Date.now();
            streamInterval = setInterval(updateStats, 1000);
            
            // Listen for image load events to track FPS
            streamImage.onload = function() {
                frameCount++;
                const now = Date.now();
                if (now - lastFrameTime > 0) {
                    fps = Math.round((frameCount * 1000) / (now - lastFrameTime));
                }
                statLastUpdate.textContent = new Date().toLocaleTimeString();
            };
            
            updateStatus(true, "Streaming...");
        }

        function stopStream() {
            isStreaming = false;
            if (streamInterval) {
                clearInterval(streamInterval);
                streamInterval = null;
            }
            streamImage.src = "";
            updateStatus(false, "Stream stopped");
        }

        async function takeSnapshot() {
            updateCameraIP();
            
            try {
                const timestamp = new Date().getTime();
                const snapshotUrl = `http://${cameraIP}/snapshot?${timestamp}`;
                
                // Open snapshot in new tab
                window.open(snapshotUrl, '_blank');
                
                // Or display in current page
                // streamImage.src = snapshotUrl;
                
            } catch (error) {
                alert('Failed to take snapshot: ' + error.message);
            }
        }

        function connectCamera() {
            updateCameraIP();
            checkCameraStatus().then(connected => {
                if (connected) {
                    alert(`Successfully connected to camera at ${cameraIP}`);
                } else {
                    alert(`Cannot connect to ${cameraIP}. Please check:\n1. Camera is powered on\n2. Correct IP address\n3. Same WiFi network`);
                }
            });
        }

        async function detectCamera() {
            // Try common IP ranges
            const baseIPs = ['192.168.1.', '192.168.0.', '10.0.0.'];
            
            for (let base of baseIPs) {
                for (let i = 100; i < 150; i++) {
                    const testIP = base + i;
                    cameraIPInput.value = testIP;
                    
                    try {
                        const response = await fetch(`http://${testIP}/status`, { 
                            timeout: 500 
                        });
                        
                        if (response.ok) {
                            cameraIP = testIP;
                            cameraIPInput.value = testIP;
                            updateStatus(true, `Auto-detected: ${testIP}`);
                            alert(`Found camera at ${testIP}`);
                            return;
                        }
                    } catch (error) {
                        // Continue scanning
                    }
                }
            }
            
            alert('Could not auto-detect camera. Please enter IP manually.');
        }

        function updateStats() {
            statFPS.textContent = fps;
            statFrames.textContent = frameCount;
        }

        function refreshStream() {
            if (isStreaming) {
                stopStream();
                setTimeout(startStream, 100);
            }
        }

        function toggleFullscreen() {
            const elem = streamImage;
            
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // Auto-refresh connection status every 10 seconds
        setInterval(checkCameraStatus, 10000);
    </script>
</body>
</html>
